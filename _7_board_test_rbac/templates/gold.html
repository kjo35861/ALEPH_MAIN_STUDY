<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>골드 전용 — 카페이야기</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  {% include 'partials/_nav.html' %}

  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- 접속 시도 결과 배너 — 통과/거부 둘 다 화면에 그대로 남겨서 제출용 캡쳐가 되게 한다 -->
    <div id="attempt-banner" class="mb-6 p-3 rounded-lg text-sm font-mono bg-gray-100 text-gray-500">
      /gold 접근 시도 중…
    </div>

    <!-- 통과했을 때 보여줄 골드 전용 컨텐츠 -->
    <section id="gold-content" class="hidden bg-white rounded-2xl shadow-sm p-8">
      <h1 class="text-2xl font-bold text-amber-600 mb-2">🥇 골드 등급 전용 페이지</h1>
      <p class="text-gray-600">이 화면은 등급이 <strong>골드(1) 이상</strong>인 로그인 사용자만 볼 수 있습니다.</p>
      <ul class="mt-6 space-y-2 text-sm text-gray-700 list-disc list-inside">
        <li>골드 회원 전용 공지: 이번 주 정모는 토요일입니다.</li>
        <li>골드 등급은 관리자 페이지에서 부여받을 수 있습니다.</li>
      </ul>
    </section>

    <!-- 실패했을 때 보여줄 예외 화면 -->
    <section id="exception-screen" class="hidden bg-white rounded-2xl shadow-sm p-8 border-2 border-red-200">
      <h1 class="text-2xl font-bold text-red-600 mb-2">⛔ 접근 권한이 없습니다</h1>
      <p id="exception-msg" class="text-gray-600"></p>
      <a href="/" class="inline-block mt-6 text-sm text-indigo-600 hover:underline">← 게시판으로 돌아가기</a>
    </section>

  </main>

  <script>
    const ROLE_LABEL = { 0: '일반', 1: '골드', 2: '관리자' };

    async function checkGoldAccess() {
      const banner = document.getElementById('attempt-banner');
      const token = localStorage.getItem('token');

      if (!token) {
        banner.textContent = 'GET /api/gold/check → 401 (로그인 필요)';
        banner.className = 'mb-6 p-3 rounded-lg text-sm font-mono bg-red-50 text-red-600';
        showException('로그인이 필요합니다. 먼저 게시판에서 로그인해 주세요.');
        return;
      }

      const res = await fetch('/api/gold/check', {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      const data = await res.json();

      if (res.ok) {
        banner.textContent = `GET /api/gold/check → ${res.status} 통과 (현재 등급: ${ROLE_LABEL[data.role]})`;
        banner.className = 'mb-6 p-3 rounded-lg text-sm font-mono bg-emerald-50 text-emerald-700';
        document.getElementById('gold-content').classList.remove('hidden');
      } else {
        banner.textContent = `GET /api/gold/check → ${res.status} 거부`;
        banner.className = 'mb-6 p-3 rounded-lg text-sm font-mono bg-red-50 text-red-600';
        showException(
          `필요 등급: ${data.required_role_name}(${data.required_role}) 이상 / ` +
          `현재 등급: ${data.current_role_name}(${data.current_role})`
        );
      }
    }

    function showException(msg) {
      document.getElementById('exception-msg').textContent = msg;
      document.getElementById('exception-screen').classList.remove('hidden');
    }

    checkGoldAccess();
  </script>
</body>
</html>
