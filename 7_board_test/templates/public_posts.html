<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busan Archive — ALEPH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="aleph-theme min-h-screen">
  {% include 'partials/_nav.html' %}

  <main class="aleph-shell py-8 md:py-10">
    <section class="aleph-hero p-6 md:p-9 mb-7">
      <div class="relative z-10 max-w-2xl">
        <div class="aleph-kicker">Public Data Explorer</div>
        <h1 class="aleph-title mt-2">Busan Theme Archive</h1>
        <p class="aleph-subtitle mt-3">부산의 테마여행 데이터를 카드형 아카이브로 탐색합니다. 이미지를 선택하면 상세 정보를 확인할 수 있습니다.</p>
      </div>
    </section>

    <div class="flex items-center justify-between gap-4 mb-5">
      <div>
        <h2 class="text-xl font-bold text-white">추천 여행 목록</h2>
        <p class="text-sm text-slate-400 mt-1">최대 100건의 공개 데이터를 표시합니다.</p>
      </div>
      <span id="item-count" class="aleph-pill">Loading</span>
    </div>

    <div id="loading" class="bg-white rounded-2xl p-10 text-center text-gray-400">데이터를 불러오는 중입니다…</div>
    <div id="postListContainer" class="public-grid"></div>
  </main>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function stripHtml(value) {
      const box = document.createElement('div');
      box.innerHTML = value || '';
      return box.textContent || box.innerText || '';
    }

    async function fetchPublicPosts() {
      const loading = document.getElementById('loading');
      const container = document.getElementById('postListContainer');
      try {
        const response = await fetch('/api/public/posts');
        const data = await response.json();
        const items = data.getRecommendedKr?.item || [];
        loading.classList.add('hidden');
        document.getElementById('item-count').textContent = items.length + ' Places';

        if (!items.length) {
          loading.classList.remove('hidden');
          loading.textContent = '조회된 데이터가 없습니다. 인증키를 확인해주세요.';
          return;
        }

        container.innerHTML = items.map(item => {
          const desc = stripHtml(item.ITEMCNTNTS || '설명이 없습니다.');
          const image = item.MAIN_IMG_THUMB || item.MAIN_IMG_NORMAL || '';
          return `
            <article class="public-card" onclick="location.href='/public-posts/${item.UC_SEQ}'">
              <img src="${esc(image)}" alt="${esc(item.TITLE || '부산 여행지')}"
                   loading="lazy" onerror="this.style.display='none'">
              <div class="public-card-body">
                <div class="aleph-kicker mb-2">BUSAN · ${esc(item.UC_SEQ)}</div>
                <h3>${esc(item.TITLE || '제목 없음')}</h3>
                <p>${esc(desc)}</p>
                <div class="mt-4 text-xs font-bold text-cyan-300">상세 정보 보기 →</div>
              </div>
            </article>`;
        }).join('');
      } catch (error) {
        loading.textContent = '데이터를 불러오는 중 오류가 발생했습니다.';
        console.error(error);
      }
    }
    fetchPublicPosts();
  </script>
</body>
</html>
