<header class="aleph-nav">
  <div class="aleph-nav-inner">
    <a href="/" class="aleph-brand">
      <span class="aleph-brand-mark">A7</span>
      <span>ALEPH BOARD<small>SECURITY LAB</small></span>
    </a>

    <nav class="aleph-menu" aria-label="주 메뉴">
      <a href="/">게시판</a>
      <a href="/dashboard" class="nav-accent">보안 대시보드</a>
      <a href="/gold">Gold Lounge</a>
      <a href="/admin">Admin</a>
      <a href="/public-posts">Busan Archive</a>
      <span id="auth-nav" class="flex items-center space-x-2 ml-2"></span>
    </nav>

    <button id="nav-toggle" type="button" class="aleph-mobile-btn"
            aria-label="메뉴 열기" aria-expanded="false" aria-controls="mobile-menu">
      <svg id="icon-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
      <svg id="icon-close" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <nav id="mobile-menu" class="aleph-mobile-menu" aria-label="모바일 메뉴">
    <a href="/">게시판</a>
    <a href="/dashboard">보안 대시보드</a>
    <a href="/gold">Gold Lounge</a>
    <a href="/admin">Admin</a>
    <a href="/public-posts">Busan Archive</a>
    <span id="auth-nav-mobile" class="block px-3 py-2 space-x-2"></span>
  </nav>
</header>

<script>
(function () {
  const btn = document.getElementById('nav-toggle');
  const menu = document.getElementById('mobile-menu');
  const iconOpen = document.getElementById('icon-open');
  const iconClose = document.getElementById('icon-close');
  if (!btn || !menu) return;

  btn.addEventListener('click', function () {
    const open = !menu.classList.contains('open');
    menu.classList.toggle('open', open);
    iconOpen.classList.toggle('hidden', open);
    iconClose.classList.toggle('hidden', !open);
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth >= 850) {
      menu.classList.remove('open');
      iconOpen.classList.remove('hidden');
      iconClose.classList.add('hidden');
      btn.setAttribute('aria-expanded', 'false');
    }
  });
})();
</script>
