<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busan Archive Detail — ALEPH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="aleph-theme min-h-screen">
  {% include 'partials/_nav.html' %}

  <main class="aleph-shell py-8 md:py-10">
    <a href="/public-posts" class="inline-flex items-center gap-2 text-sm font-bold text-cyan-300 hover:text-cyan-200 mb-5">← Busan Archive로 돌아가기</a>

    <div id="loading" class="bg-white rounded-2xl p-10 text-center text-gray-400">상세 정보를 불러오는 중입니다…</div>

    <article id="detailContainer" class="public-detail-card hidden">
      <div class="p-6 md:p-9 border-b border-slate-700/40">
        <div class="aleph-kicker">Busan Travel Detail</div>
        <h1 id="postTitle" class="aleph-title mt-2"></h1>
        <p class="aleph-subtitle mt-3">부산 공개 관광 데이터 기반 상세 정보</p>
      </div>

      <div class="grid lg:grid-cols-2 gap-0">
        <div class="p-5 md:p-7 border-b lg:border-b-0 lg:border-r border-slate-700/40">
          <div class="text-xs font-bold tracking-widest text-slate-400 mb-3">THUMBNAIL</div>
          <img id="thumbImg" class="public-detail-image rounded-xl" src="" alt="썸네일 이미지">
        </div>
        <div class="p-5 md:p-7">
          <div class="text-xs font-bold tracking-widest text-slate-400 mb-3">ORIGINAL IMAGE</div>
          <img id="normalImg" class="public-detail-image rounded-xl" src="" alt="원본 이미지">
        </div>
      </div>

      <section class="p-6 md:p-9 border-t border-slate-700/40">
        <div class="aleph-kicker">About this place</div>
        <div id="postContent" class="mt-4 leading-8 text-slate-300"></div>
      </section>
    </article>
  </main>

  <script>
    const pathSegments = window.location.pathname.split('/');
    const currentUcSeq = Number(pathSegments[pathSegments.length - 1]);

    async function fetchDetailData() {
      const loading = document.getElementById('loading');
      try {
        const response = await fetch('/api/public/posts');
        const data = await response.json();
        const items = data.getRecommendedKr?.item || [];
        const targetItem = items.find(item => Number(item.UC_SEQ) === currentUcSeq);

        if (!targetItem) {
          loading.textContent = '해당 데이터를 찾을 수 없습니다.';
          return;
        }

        document.getElementById('postTitle').textContent = targetItem.TITLE || '제목 없음';
        const thumb = document.getElementById('thumbImg');
        const normal = document.getElementById('normalImg');
        thumb.src = targetItem.MAIN_IMG_THUMB || targetItem.MAIN_IMG_NORMAL || '';
        normal.src = targetItem.MAIN_IMG_NORMAL || targetItem.MAIN_IMG_THUMB || '';
        thumb.onerror = () => thumb.style.display = 'none';
        normal.onerror = () => normal.style.display = 'none';

        const rawContent = targetItem.ITEMCNTNTS || '상세 설명이 없습니다.';
        const temp = document.createElement('div');
        temp.innerHTML = rawContent;
        document.getElementById('postContent').textContent = temp.textContent || temp.innerText || rawContent;

        loading.classList.add('hidden');
        document.getElementById('detailContainer').classList.remove('hidden');
      } catch (error) {
        loading.textContent = '상세 데이터를 불러오는 중 오류가 발생했습니다.';
        console.error(error);
      }
    }

    fetchDetailData();
  </script>
</body>
</html>
